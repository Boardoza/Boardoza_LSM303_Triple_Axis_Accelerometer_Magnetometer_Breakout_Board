sentence=Library for Boardoza LSM303AGR 3D Accelerometer and 3D Magnetometer with I2C and SPI support
paragraph=Easy-to-use Arduino library for the STMicroelectronics LSM303AGR ultra-compact eCompass module. Features dual I2C/SPI protocol support (competitive advantage over other libraries), 3-axis accelerometer with ±2g to ±16g ranges, 3-axis magnetometer with ±50 gauss range, temperature sensor, self-test capabilities, and advanced power management. Complete integration with Boardoza ecosystem and production-ready examples included.
